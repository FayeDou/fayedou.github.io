short_bio_text_justify: false
short_bio: >-
  <p>Fei Dou is an Assistant Professor in the <a href="https://cs.uga.edu/">School of Computing</a> at the <a href="https://uga.edu/">University of Georgia</a>. She obtained her Ph.D. degree from the Department of Computer Science and Engineering at the <a href="https://uconn.edu/">University of Connecticut</a>  in 
  <a href="https://healthinfo.lab.uconn.edu/">Laboratory of Machine Learning & Health Informatics</a>, working on 
  <b> Machine Learning (ML) </b> / <b>Artificial Intelligence (AI)</b> in the <b> Internet of Things (IoT) / Cyber-Physical Systems (CPS)</b> 
  supervised by Prof. <a href="https://jinbo-bi.uconn.edu/"><b>Jinbo Bi</b></a>.
   </p>
  <p>
    Fei Dou’s research focuses on advancing <u><b>Machine Intelligence for Ubiquitous Computing in Distributed Systems</b></u>, with an emphasis on scalable, responsible, and context-aware AI solutions.
  </p>

