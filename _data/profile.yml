short_bio: >-
  <p>Fei Dou is an Assistant Professor in the <a href="https://cs.uga.edu/">School of Computing</a> at the <a href="https://uga.edu/">University of Georgia</a>. She obtained her Ph.D. in 2023 from the Department of Computer Science and Engineering at the <a href="https://uconn.edu/">University of Connecticut</a>, where she worked in the  
  <a href="https://healthinfo.lab.uconn.edu/">Laboratory of Machine Learning & Health Informatics</a> under the supervision of Prof. <a href="https://jinbo-bi.uconn.edu/"><b>Jinbo Bi</b></a>. 
 
  </p>

   
  <p>Fei's research is in <b>Machine Learning (ML)</b>, with a focus on developing robust, scalable, and context-aware learning methods and AI solutions for <b>real-world human-centered problems</b>.
  Broadly, she studies how machine learning algorithms can operate effectively in complex environments characterized 
  by noisy, multimodal, heterogeneous, distributed, and context-dependent data. This perspective drives her research at the intersection of 
  machine learning, ubiquitous computing, intelligent sensing, and health AI, where she develops novel learning methods and intelligent systems for real-world 
  applications, such as contactless physiological monitoring, activity understanding, and distributed sensing. Ultimately, across these domains, 
  her goal is to advance machine learning that is both methodologically grounded and practically impactful.
  Fei's work has appeared in leading venues across AI and ubiquitous computing, including NeurIPS, IJCAI, EMNLP, ICCV Findings, UbiComp/IMWUT, SenSys, PerCom, ISWC, IEEE TMC, and IEEE IoT-J. 
  </p>

  <p>
   <b><span style="color: red;">Join Us</span></b>: Our lab is seeking highly self-motivated PhD students to explore cutting-edge research in AI, machine learning and intelligent sensing.
  </p>

