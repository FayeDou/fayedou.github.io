short_bio: >-
  <p>Fei Dou is an Assistant Professor in the <a href="https://cs.uga.edu/">School of Computing</a> at the <a href="https://uga.edu/">University of Georgia</a>. She obtained her Ph.D. in 2023 from the Department of Computer Science and Engineering at the <a href="https://uconn.edu/">University of Connecticut</a>, where she worked in the  
  <a href="https://healthinfo.lab.uconn.edu/">Laboratory of Machine Learning & Health Informatics</a> under the supervision of Prof. <a href="https://jinbo-bi.uconn.edu/"><b>Jinbo Bi</b></a>. 
  Her research lies at the intersection of <b>Machine Learning (ML)</b>, ubiquitous computing, and health AI, with a focus on developing fundamental and deployable AI 
  methods for real-world human-centered problems.

   </p>
  <p>
    Fei’s research broadly explores machine intelligence for ubiquitous computing and distributed intelligent systems, with an emphasis on scalable, responsible, and  context-aware AI solutions.
  </p>

  <p>
    <span style="color: red;">Join Us</span>: Our lab is seeking highly self-motivated PhD students to explore cutting-edge research in AI, machine learning and intelligent sensing.
  </p>

